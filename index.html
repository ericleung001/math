<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學小練習</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <div id="passcode-modal" class="passcode-overlay hidden">
            <div class="passcode-box">
                <h3>請輸入管理密碼</h3>
                <input type="password" id="passcode-input" maxlength="4" placeholder="****" autocomplete="off">
                <p id="passcode-error" class="error-msg"></p>
                <button id="passcode-submit-btn" class="play-btn">確認</button>
            </div>
        </div>

        <nav class="main-nav">
            <button id="nav-quiz" class="nav-btn active">數學測驗</button>
            <button id="nav-table" class="nav-btn">乘數表學習</button>
            <button id="nav-admin" class="nav-btn">⚙️ 設定</button>
        </nav>

        <section id="quiz-section" class="page-section"></section>
        <section id="table-section" class="page-section hidden"></section>
        <section id="admin-section" class="page-section hidden"></section>
    </div>

    <script async src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
